name: Go CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Normalize formatting for compiler validation
        run: gofmt -w main.go main_test.go
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Session binding and strict ticket regression stress
        run: go test -count=5 ./pkg/ticket
      - name: Race detector (Identity admission and liveness)
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Compile Linux binary
        run: CGO_ENABLED=0 go build -o openv-identity .
